<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synonym Management - Runyankore Translator Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Add synonym-specific styles to admin.css or create a new file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/synonyms.css') }}">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Admin Panel</h3>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin_dashboard') }}">
                        <i class="fas fa-dashboard"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin_translations_page') }}">
                        <i class="fas fa-language"></i> Translations
                    </a>
                </li>
                <li class="nav-item">
             <a class="nav-link" href="{{ url_for('admin_searches') }}">
              <i class="fas fa-search"></i> User Searches
              </a>
              </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin_review') }}">
                        <i class="fas fa-check-circle"></i> Review
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin_trash') }}">
                        <i class="fas fa-trash"></i> Trash
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="{{ url_for('admin_synonyms') }}">
                        <i class="fas fa-link"></i> Synonyms
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin_logout') }}">
                        <i class="fas fa-sign-out"></i> Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="synonym-container">
                <!-- Header -->
                <div class="synonym-header">
                    <h1><i class="fas fa-link"></i> Synonym Management</h1>
                    <div class="user-info">
                        <i class="fas fa-user"></i> {{ username }}
                    </div>
                </div>

                <!-- Stats Card -->
                <div class="stats-card">
                    <div class="stats-row">
                        <div class="stats-col">
                            <div class="stats-number" id="totalSynonyms">0</div>
                            <div class="stats-label">Total Synonym Pairs</div>
                        </div>
                        <div class="stats-col">
                            <div class="stats-number" id="uniqueWords">0</div>
                            <div class="stats-label">Unique Words</div>
                        </div>
                        <div class="stats-col">
                            <div class="stats-number" id="coverage">0</div>
                            <div class="stats-label">Translation Coverage</div>
                        </div>
                    </div>
                </div>

                <!-- Add Synonym Form -->
                <div class="add-synonym-form">
                    <h3>Add New Synonym Relationship</h3>
                    <p class="text-muted">Example: "tasty" is a synonym of "delicious"</p>
                    
                    <div class="form-group position-relative">
                        <label for="word">Word:</label>
                        <input type="text" id="word" class="form-control" placeholder="e.g., tasty" autocomplete="off">
                        <div id="wordSuggestions" class="suggestion-box hidden"></div>
                    </div>

                    <div class="form-group position-relative">
                        <label for="synonymOf">Is synonym of:</label>
                        <input type="text" id="synonymOf" class="form-control" placeholder="e.g., delicious" autocomplete="off">
                        <div id="targetSuggestions" class="suggestion-box hidden"></div>
                    </div>

                    <button id="addSynonymBtn" class="btn-primary">
                        <i class="fas fa-plus"></i> Add Synonym
                    </button>
                </div>

                <!-- Search Box -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search synonyms..." class="form-control">
                </div>

                <!-- Synonyms List -->
                <div class="synonym-list" id="synonymList">
                    <!-- Will be populated by JavaScript -->
                    <div class="text-center p-4">
                        <i class="fas fa-spinner fa-spin"></i> Loading synonyms...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Area -->
    <div id="notificationArea" class="notification-area"></div>

    <script>
        // ========== STATE ==========
        let allSynonyms = [];
        let currentUser = "{{ username }}";

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadSynonyms();
            setupEventListeners();
        });

        // ========== SETUP EVENT LISTENERS ==========
        function setupEventListeners() {
            // Add synonym button
            document.getElementById('addSynonymBtn').addEventListener('click', addSynonym);

            // Search input
            document.getElementById('searchInput').addEventListener('input', filterSynonyms);

            // Word input suggestions
            const wordInput = document.getElementById('word');
            wordInput.addEventListener('input', function() {
                showSuggestions(this.value, 'wordSuggestions');
            });
            wordInput.addEventListener('blur', function() {
                setTimeout(() => {
                    document.getElementById('wordSuggestions').classList.add('hidden');
                }, 200);
            });

            // Target input suggestions
            const targetInput = document.getElementById('synonymOf');
            targetInput.addEventListener('input', function() {
                showSuggestions(this.value, 'targetSuggestions');
            });
            targetInput.addEventListener('blur', function() {
                setTimeout(() => {
                    document.getElementById('targetSuggestions').classList.add('hidden');
                }, 200);
            });

            // Enter key in inputs
            wordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addSynonym();
            });
            targetInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addSynonym();
            });
        }

        // ========== LOAD SYNONYMS ==========
        function loadSynonyms() {
            fetch('/admin/api/synonyms/list')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        allSynonyms = data.synonyms;
                        displaySynonyms(allSynonyms);
                        updateStats();
                    } else {
                        showNotification('Failed to load synonyms', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showNotification('Error loading synonyms', 'error');
                });
        }

        // ========== DISPLAY SYNONYMS ==========
        function displaySynonyms(synonyms) {
            const container = document.getElementById('synonymList');
            
            if (!synonyms || synonyms.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-link fa-3x"></i>
                        <p class="text-muted">No synonyms found. Add your first synonym pair!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            synonyms.forEach(syn => {
                const createdDate = new Date(syn.created_at).toLocaleString();
                html += `
                    <div class="synonym-item" data-id="${syn.id}">
                        <div class="synonym-info">
                            <span class="synonym-word">${syn.word}</span>
                            <span class="synonym-arrow"><i class="fas fa-arrow-right"></i></span>
                            <span class="synonym-target">${syn.synonym_of}</span>
                            <span class="synonym-meta">
                                <i class="fas fa-user"></i> ${syn.created_by || 'admin'} |
                                <i class="fas fa-clock"></i> ${createdDate}
                            </span>
                            <span class="relation-badge">${syn.language || 'english'}</span>
                        </div>
                        <button class="btn-danger btn-sm" onclick="deleteSynonym(${syn.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ========== ADD SYNONYM ==========
        function addSynonym() {
            const word = document.getElementById('word').value.trim();
            const synonymOf = document.getElementById('synonymOf').value.trim();

            if (!word || !synonymOf) {
                showNotification('Please enter both words', 'error');
                return;
            }

            if (word === synonymOf) {
                showNotification('A word cannot be a synonym of itself', 'error');
                return;
            }

            fetch('/admin/api/synonyms/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word, synonym_of: synonymOf })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification(data.message, 'success');
                    document.getElementById('word').value = '';
                    document.getElementById('synonymOf').value = '';
                    loadSynonyms(); // Reload list
                } else {
                    showNotification(data.message || 'Failed to add synonym', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Error adding synonym', 'error');
            });
        }

        // ========== DELETE SYNONYM ==========
        function deleteSynonym(id) {
            if (!confirm('Are you sure you want to delete this synonym relationship?')) {
                return;
            }

            fetch(`/admin/api/synonyms/delete/${id}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification('Synonym deleted successfully', 'success');
                    loadSynonyms(); // Reload list
                } else {
                    showNotification(data.message || 'Failed to delete synonym', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Error deleting synonym', 'error');
            });
        }

        // ========== FILTER SYNONYMS ==========
        function filterSynonyms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                displaySynonyms(allSynonyms);
                return;
            }

            const filtered = allSynonyms.filter(syn => 
                syn.word.toLowerCase().includes(searchTerm) ||
                syn.synonym_of.toLowerCase().includes(searchTerm)
            );
            
            displaySynonyms(filtered);
        }

        // ========== SHOW SUGGESTIONS ==========
        function showSuggestions(query, elementId) {
            if (!query || query.length < 2) {
                document.getElementById(elementId).classList.add('hidden');
                return;
            }

            fetch(`/admin/api/synonyms/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.synonyms.length > 0) {
                        const suggestions = document.getElementById(elementId);
                        let html = '';
                        
                        // Get unique words
                        const words = new Set();
                        data.synonyms.forEach(syn => {
                            words.add(syn.word);
                            words.add(syn.synonym_of);
                        });

                        Array.from(words).slice(0, 5).forEach(word => {
                            html += `<div class="suggestion-item" onclick="selectSuggestion('${word}', '${elementId}')">${word}</div>`;
                        });

                        suggestions.innerHTML = html;
                        suggestions.classList.remove('hidden');
                    } else {
                        document.getElementById(elementId).classList.add('hidden');
                    }
                });
        }

        // ========== SELECT SUGGESTION ==========
        function selectSuggestion(word, elementId) {
            if (elementId === 'wordSuggestions') {
                document.getElementById('word').value = word;
            } else {
                document.getElementById('synonymOf').value = word;
            }
            document.getElementById(elementId).classList.add('hidden');
        }

        // ========== UPDATE STATS ==========
        function updateStats() {
            document.getElementById('totalSynonyms').textContent = allSynonyms.length;
            
            // Count unique words
            const uniqueWords = new Set();
            allSynonyms.forEach(syn => {
                uniqueWords.add(syn.word);
                uniqueWords.add(syn.synonym_of);
            });
            document.getElementById('uniqueWords').textContent = uniqueWords.size;
            
            // Estimate coverage (simplified)
            document.getElementById('coverage').textContent = 
                Math.min(100, Math.round((allSynonyms.length / 50) * 100)) + '%';
        }

        // ========== SHOW NOTIFICATION ==========
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            
            const area = document.getElementById('notificationArea');
            area.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
